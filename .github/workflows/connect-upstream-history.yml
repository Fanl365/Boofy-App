name: Connect preserved upstream history
on:
  push:
    branches: [main]
    paths: ['.github/workflows/connect-upstream-history.yml']
permissions:
  contents: write
jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - run: |
          git config user.name Boofy
          git config user.email fanlong.365@gmail.com
          git remote add upstream https://github.com/beefyfinance/beefy-app.git || true
          git fetch upstream master
          git merge -s ours --allow-unrelated-histories upstream/master -m 'chore: preserve Beefy App upstream development history'
          git push origin HEAD:main
